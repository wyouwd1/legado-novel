name: Auto Build

on:
  push:
    branches:
      - main
    paths:
      - '**'
      # - '!**/assets/**'
      # - '!**.md'
      - '!**/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      versionL: ${{ steps.set-ver.outputs.full_version_name }}
      version: ${{ steps.set-ver.outputs.current_version }}
      build_number: ${{ steps.set-ver.outputs.build_number }}
      commit_number: ${{ steps.set-ver.outputs.commit_number }}
      latest_tag: ${{ steps.set-ver.outputs.last_tag }}
      is_release: ${{ steps.set-ver.outputs.is_release }}
      has_signing: ${{ steps.set-ver.outputs.has_signing }}
      tag_exists: ${{ steps.set-ver.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 计算版本号和构建号
        id: set-ver
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "Commit 总数 (Build Number): $COMMIT_COUNT"
          
          PROPERTIES_FILE="./app/version.properties"
          if [[ ! -f "$PROPERTIES_FILE" ]]; then
            echo "错误：version.properties 文件不存在于 $PROPERTIES_FILE"
            exit 1
          fi
          
          # --- 1. 读取基础版本和发布标志 ---
          MAJOR=$(cat "$PROPERTIES_FILE" | grep 'VERSION_MAJOR' | cut -d'=' -f2 | tr -d '[:space:]')
          MINOR=$(cat "$PROPERTIES_FILE" | grep 'VERSION_MINOR' | cut -d'=' -f2 | tr -d '[:space:]')
          PATCH=$(cat "$PROPERTIES_FILE" | grep 'VERSION_PATCH' | cut -d'=' -f2 | tr -d '[:space:]')
          RELEASE_FLAG=$(cat "$PROPERTIES_FILE" | grep 'VERSION_SUFFIX' | cut -d'=' -f2 | tr -d '[:space:]')
          
          CURRENT_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_BUILD_NUM=0
          VERSION_SUFFIX_NAME=""
          IS_RELEASE="false" # 默认为 Pre-release
          
          # 2. 确定版本类型和后缀
          if [[ "${RELEASE_FLAG}" == "0" ]]; then
            # 标记为正式版 (VERSION_SUFFIX=0)
            VERSION_SUFFIX_NAME=""
            IS_RELEASE="true"
            echo "版本类型: 正式版 (Release), 版本名: $CURRENT_VERSION"
          
            # 找到最近的正式版本 tag 作为日志起点
            LAST_TAG_FOR_LOG=$(git tag --list "$MAJOR.$MINOR.*" --sort=-committerdate | grep -v 'beta' | head -n 2 | tail -n 1)
            if [ -z "$LAST_TAG_FOR_LOG" ]; then
                # 如果找不到上一个正式版，则从最近的非本次构建的 tag 开始
                LAST_TAG_FOR_LOG=$(git tag --sort=-committerdate | head -n 2 | tail -n 1)
            fi
          
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]] && [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # 标记为测试版 (VERSION_SUFFIX=1 或其他/空)，且在 main 分支推送
          
            # Do not derive the beta number from tags: this build-only workflow does not
            # create tags, so every push would otherwise reuse -beta.1.
            NEW_BUILD_NUM="${GITHUB_RUN_NUMBER:-1}"
            VERSION_SUFFIX_NAME="-beta.$NEW_BUILD_NUM"
          
            # 日志从最近的任意 TAG 开始 (包括上一个 beta.x tag)
            LAST_ANY_TAG=$(git tag --sort=-committerdate | head -n 1)
            LAST_TAG_FOR_LOG="${LAST_ANY_TAG#v}"
            echo "版本类型: 预发布版 (Pre-release), 构建号: $NEW_BUILD_NUM"
          
          else
            # 其它情况 (PR, 非 main 分支推送等)，构建号设为 0
            NEW_BUILD_NUM=0
            LAST_ANY_TAG=$(git tag --sort=-committerdate | head -n 1)
            LAST_TAG_FOR_LOG="${LAST_ANY_TAG#v}"
            echo "非 main 分支推送/PR，构建号设置为 $NEW_BUILD_NUM"
          fi
          
          # 3. 构造最终版本信息
          FULL_VERSION_NAME="${CURRENT_VERSION}${VERSION_SUFFIX_NAME}"
          
          # 4. 设置输出供后续作业使用
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "full_version_name=$FULL_VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$NEW_BUILD_NUM" >> $GITHUB_OUTPUT
          echo "commit_number=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "last_tag=$LAST_TAG_FOR_LOG" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT # 新s的输出标志
          if [[ -n "${SIGNING_KEY:-}" ]]; then
            echo "has_signing=true" >> $GITHUB_OUTPUT
          else
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "::warning::未配置 SIGNING_KEY，构建产物将未签名，create_release 会被跳过"
          fi
          if git rev-parse -q --verify "refs/tags/v$FULL_VERSION_NAME" >/dev/null; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "::warning::tag v$FULL_VERSION_NAME 已存在，跳过发布（需要发布新版本时先 bump version.properties）"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    strategy:
      matrix:
        product: [ app ]
        type: [ release ]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      product: ${{ matrix.product }}
      type: ${{ matrix.type }}
      # 使用 prepare job 的输出
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSIONL: ${{ needs.prepare.outputs.versionL }}
      COMMIT_NUMBER_VAL: ${{ needs.prepare.outputs.commit_number }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Clear 18PlusList.txt
        run: |
          echo "清空18PlusList.txt"
          echo "">$GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt
      - name: 配置 Release 签名
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "::warning::未配置 SIGNING_KEY，跳过签名配置"
            exit 0
          fi
          echo "$SIGNING_KEY" | base64 -d > "$GITHUB_WORKSPACE/app/my-release-key.jks"
          {
            echo ""
            echo "RELEASE_STORE_FILE=my-release-key.jks"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_WORKSPACE/gradle.properties"
          echo "签名配置已写入 gradle.properties"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Build With Gradle
        run: |
          echo "开始${{ env.product }}${{ env.type }}构建"
          echo "VersionName: $APP_VERSION_NAME"
          echo "VersionCode (Commit Number): $COMMIT_NUMBER"
          chmod +x gradlew
          # 将 type 首字母大写以匹配 Gradle Task
          TYPE_CAP=$(echo ${{ env.type }} | awk '{print toupper(substr($0,1,1))substr($0,2)}')
          ./gradlew assemble${{ env.product }}${TYPE_CAP} --no-configuration-cache
        env:
          COMMIT_NUMBER: ${{ env.COMMIT_NUMBER_VAL }}
          APP_VERSION_NAME: ${{ env.VERSIONL }}

      - name: Move Mapping Files
        if: matrix.type == 'release'
        run: |
          echo "移动 mapping 相关文件"
          MAPPING_DIR="${{ github.workspace }}/mapping"
          MAPPING_ROOT="${{ github.workspace }}/app/build/outputs/mapping"
          mkdir -p "$MAPPING_DIR"
          test -d "$MAPPING_ROOT" || { echo "::error::mapping directory missing"; exit 1; }
          MAPPING_FILE=$(find "$MAPPING_ROOT" -name "mapping.txt" -print -quit)
          test -n "$MAPPING_FILE" || { echo "::error::mapping.txt missing"; exit 1; }
          mv "$MAPPING_FILE" "$MAPPING_DIR/mapping.txt"
          find "$MAPPING_ROOT" -name "missing_rules.txt" -exec mv {} "$MAPPING_DIR/missing_rules.txt" \; || true

      - name: Upload Missing Rules File To Artifact
        if: matrix.type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: legado.${{ env.product }}.${{ env.type }}.mapping.missing_rules
          if-no-files-found: ignore
          path: ${{ github.workspace }}/mapping/missing_rules.txt

      - name: Check Build production
        run: |
          echo "检查 APK 输出目录"
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/${{ env.product }}/${{ env.type }}"
          # 检查是否有任何 APK 文件生成
          if [ -z "$(find "$APK_PATH" -name "*.apk" -print -quit)" ]; then
            echo "Build production not found! Check gradle logs."
            exit 1
          fi

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-apk-${{ env.type }}
          if-no-files-found: error
          path: app/build/outputs/apk/${{ env.product }}/${{ env.type }}/*universal*.apk

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a-apk-${{ env.type }}
          if-no-files-found: error
          path: app/build/outputs/apk/${{ env.product }}/${{ env.type }}/*arm64-v8a*.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: armeabi-v7a-apk-${{ env.type }}
          if-no-files-found: error
          path: app/build/outputs/apk/${{ env.product }}/${{ env.type }}/*armeabi-v7a*.apk

      - name: Upload Mapping File To Artifact
        if: matrix.type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: legado.${{ env.product }}.${{ env.type }}.mapping
          if-no-files-found: error
          path: ${{ github.workspace }}/mapping/mapping.txt

      - name: Save release metadata
        if: matrix.type == 'release'
        run: |
          {
            echo "VERSIONL=${{ needs.prepare.outputs.versionL }}"
            echo "LATEST_TAG=${{ needs.prepare.outputs.latest_tag }}"
            echo "IS_RELEASE=${{ needs.prepare.outputs.is_release }}"
          } > release-metadata.env

      - name: Upload Release Metadata
        if: matrix.type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          if-no-files-found: error
          path: release-metadata.env

  # main 推送成功后自动发布 pre-release，附上三个架构的 APK。
  # 必须已配置签名 secret 才发布：未签名 APK 无法安装，宁可不发。
  # VERSION_SUFFIX=0 发正式版，否则发 pre-release；tag 已存在时跳过，避免覆盖已发布版本。
  create_release:
    needs: [ prepare, build ]
    if: |
      needs.prepare.outputs.has_signing == 'true' &&
      needs.prepare.outputs.tag_exists != 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 下载 APK Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-apk-release'
          path: artifacts
          merge-multiple: true

      - name: 整理 APK 文件名
        run: |
          VERSIONL="${{ needs.prepare.outputs.versionL }}"
          test -n "$(find artifacts -maxdepth 1 -name '*.apk' -print -quit)" || {
            echo "::error::没有下载到 APK artifact"
            exit 1
          }
          shopt -s nullglob
          for f in artifacts/*.apk; do
            out="artifacts/legado-novel-${VERSIONL}"
            if [[ "$f" == *arm64-v8a* ]]; then
              out="${out}-arm64-v8a"
            elif [[ "$f" == *armeabi-v7a* ]]; then
              out="${out}-armeabi-v7a"
            fi
            out="${out}.apk"
            [[ "$f" == "$out" ]] || mv "$f" "$out"
          done
          ls -l artifacts

      - name: 校验 APK 签名
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [[ -z "$APKSIGNER" ]]; then
            APKSIGNER=$(command -v apksigner || true)
          fi
          test -n "$APKSIGNER" || { echo "::error::找不到 apksigner"; exit 1; }
          for f in artifacts/legado-*.apk; do
            "$APKSIGNER" verify --print-certs "$f" >/dev/null || {
              echo "::error::$f 签名校验失败，拒绝发布未签名 APK"
              exit 1
            }
          done
          echo "全部 APK 签名校验通过"

      - name: 生成 Release Notes
        id: notes
        run: |
          CURRENT="v${{ needs.prepare.outputs.versionL }}"
          PREV=$(git tag --sort=-creatordate | grep -v "^${CURRENT}$" | head -n 1 || true)
          if [[ -n "$PREV" ]]; then
            LOG=$(git log "$PREV"..HEAD --pretty=format:"- %s" --no-merges)
            RANGE="${PREV}...${CURRENT}"
          else
            LOG=$(git log -1 --pretty=format:"- %s")
            RANGE="${CURRENT}"
          fi
          {
            echo "body<<EOF"
            echo "### 更新内容"
            echo ""
            echo "${LOG:-- 无新增提交}"
            echo ""
            echo "**Full Changelog**: https://github.com/wyouwd1/legado-novel/compare/${RANGE}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.versionL }}
          name: ${{ needs.prepare.outputs.is_release == 'true' && format('Release v{0}', needs.prepare.outputs.versionL) || format('Pre-release v{0}', needs.prepare.outputs.versionL) }}
          prerelease: ${{ needs.prepare.outputs.is_release != 'true' }}
          make_latest: ${{ needs.prepare.outputs.is_release == 'true' }}
          body: ${{ steps.notes.outputs.body }}
          files: artifacts/legado-novel-${{ needs.prepare.outputs.versionL }}*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

